# Thông báo lỗi validate (Bean Validation) bằng tiếng Việt — trả về trong trường "errors" của model lỗi.
# Chọn theo header Accept-Language (mặc định vi); tiếng Anh dùng bản có sẵn của Hibernate Validator.
# Thêm ràng buộc mới (@Pattern, @Past...) thì bổ sung key tương ứng ở đây.
jakarta.validation.constraints.NotBlank.message=không được để trống
jakarta.validation.constraints.NotNull.message=không được để trống
jakarta.validation.constraints.NotEmpty.message=không được để trống
jakarta.validation.constraints.Email.message=không đúng định dạng email
jakarta.validation.constraints.Size.message=độ dài phải từ {min} đến {max} ký tự
jakarta.validation.constraints.Min.message=phải lớn hơn hoặc bằng {value}
jakarta.validation.constraints.Max.message=phải nhỏ hơn hoặc bằng {value}
jakarta.validation.constraints.Positive.message=phải lớn hơn 0
jakarta.validation.constraints.PositiveOrZero.message=phải lớn hơn hoặc bằng 0
jakarta.validation.constraints.Pattern.message=không đúng định dạng
jakarta.validation.constraints.Past.message=phải là một thời điểm trong quá khứ
jakarta.validation.constraints.Future.message=phải là một thời điểm trong tương lai
