server:
  port: 8080

spring:
  application:
    name: charlie-quizlet-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/charlie_quizlet}
    username: ${DB_USERNAME:quizlet}
    password: ${DB_PASSWORD:quizlet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Dev-only default; always set JWT_SECRET (>= 32 bytes) in other environments.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: charlie-quizlet
    expiration: ${JWT_EXPIRATION:PT24H}

management:
  endpoints:
    web:
      exposure:
        include: health
