server:
  port: 8080

spring:
  application:
    name: charlie-quizlet-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/charlie_quizlet}
    username: ${DB_USERNAME:quizlet}
    password: ${DB_PASSWORD:quizlet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # Nạp quan hệ lazy theo lô (1 query cho tối đa 100 phần tử) thay vì từng dòng — tránh N+1 khi duyệt
      # câu hỏi / đáp án của bộ đề, lượt làm bài.
      hibernate.default_batch_fetch_size: 100
  flyway:
    enabled: true
  web:
    # Ngôn ngữ thông báo lỗi lấy theo header Accept-Language; request không gửi header thì dùng tiếng Việt.
    locale: vi
    locale-resolver: accept-header

app:
  # Cấu hình riêng của app — đọc trong code qua config/AppProperties (JWT: auth/JwtProperties).
  frontend:
    # URL của app Angular, dùng để tạo link gửi cho người dùng (vd. đặt lại mật khẩu).
    url: ${FRONTEND_URL:http://localhost:4200}
    # Phải khớp route 'reset-password' của FE (src/app/core/config/routes.ts).
    reset-password-path: /reset-password
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  password-reset:
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
  error-codes:
    # Thời gian cache bảng error_codes; sửa thông báo lỗi trong DB có hiệu lực sau khoảng này.
    cache-ttl: ${ERROR_CODES_CACHE_TTL:PT5M}
  attempt:
    # Số câu mỗi lượt thi thử khi bộ đề không tự đặt (rút ngẫu nhiên từ ngân hàng; đề ít câu hơn thì làm hết).
    default-exam-question-count: ${DEFAULT_EXAM_QUESTION_COUNT:30}
  admin:
    # Tài khoản Admin tạo lúc khởi động nếu email chưa tồn tại. Mặc định chỉ dùng cho dev;
    # môi trường khác BẮT BUỘC đặt ADMIN_PASSWORD (hoặc để ADMIN_EMAIL rỗng để không tạo).
    email: ${ADMIN_EMAIL:admin@charlie-quizlet.local}
    password: ${ADMIN_PASSWORD:admin12345}
    full-name: ${ADMIN_FULL_NAME:Administrator}
  jwt:
    # Giá trị mặc định chỉ dùng cho dev; môi trường khác BẮT BUỘC đặt JWT_SECRET (>= 32 byte).
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: charlie-quizlet
    # Access token (JWT) để ngắn: hết hạn thì FE dùng refresh token lấy token mới, không phải đăng nhập lại.
    expiration: ${JWT_EXPIRATION:PT15M}
    # Refresh token: mỗi lần làm mới được token mới, thời hạn tính lại từ đầu.
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P30D}

springdoc:
  # Tắt trên production: SWAGGER_ENABLED=false.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health
